steps:
  - name: 'node:18'
    entrypoint: 'npm'
    args: ['ci']
    id: 'install'

  - name: 'node:18'
    entrypoint: 'bash'
    # //test2333
    args:
      - -c
      - |
        echo "=== Security Audit ==="
        npm audit || echo " Vulnerabilities found - review needed"
    id: 'audit'
    waitFor: ['install']

  - name: 'node:18'
    entrypoint: 'npm'
    args: ['run', 'build']
    id: 'build'
    waitFor: ['install']

  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - -c
      - |
        echo "================================="
        echo " Build Successful!"
        echo "Commit: ${SHORT_SHA}"
        echo "Branch: ${BRANCH_NAME}"
        echo "================================="
    id: 'summary'
    waitFor: ['build', 'audit']

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'

timeout: '1800s'